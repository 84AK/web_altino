<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>알티노 코딩 실험실 - 시안 A 에디터형</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{
  --bg:#f6f1e7; --paper:#fbf8f1; --ink:#1f1b16; --sub:#6b6258; --line:#d9d0bf;
  --accent:#b8470f; --accent-ink:#fff; --danger:#b91c1c; --ok:#2f6f4f; --code-bg:#fbf8f1;
  --kw:#9a3412; --str:#2f6f4f; --cm:#8a8070; --num:#1d4ed8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1814; --paper:#221e19; --ink:#efe8da; --sub:#a99f8f; --line:#3a342b;
    --accent:#f08a4b; --accent-ink:#1b1814; --danger:#f87171; --ok:#6fcf97; --code-bg:#221e19;
    --kw:#f0a070; --str:#8fd6a8; --cm:#8a8070; --num:#8ab4ff;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1814; --paper:#221e19; --ink:#efe8da; --sub:#a99f8f; --line:#3a342b;
  --accent:#f08a4b; --accent-ink:#1b1814; --danger:#f87171; --ok:#6fcf97; --code-bg:#221e19;
  --kw:#f0a070; --str:#8fd6a8; --cm:#8a8070; --num:#8ab4ff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;font-size:17px;line-height:1.65}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh;min-height:640px}
header{display:flex;align-items:center;gap:24px;padding:14px 28px;border-bottom:1px solid var(--line)}
h1{font-family:"Noto Serif KR",serif;font-size:22px;margin:0;letter-spacing:-.01em}
h1 small{font-family:"Pretendard Variable",sans-serif;font-weight:400;font-size:15px;color:var(--sub);margin-left:10px}
.spacer{flex:1}
header{flex-wrap:wrap}
.link,.status{white-space:nowrap}
@media (max-width:1180px){h1 small{display:none}}
.status{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:16px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--sub);transition:background .3s}
.status.on .dot{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
.link{background:none;border:0;color:var(--ink);font:inherit;cursor:pointer;padding:4px 0;position:relative;font-weight:600}
.link::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .25s}
.link:hover::after,.link:focus-visible::after{transform:scaleX(1)}
.link.stop{color:var(--danger)}
.link.stop::after{background:var(--danger);transform:scaleX(1)}
main{display:grid;grid-template-columns:240px 1fr;min-height:0}
nav{border-right:1px solid var(--line);padding:22px 20px;overflow:auto}
nav h2{font-size:15px;color:var(--sub);font-weight:600;margin:0 0 10px;letter-spacing:.04em}
nav ol{list-style:none;margin:0 0 26px;padding:0}
nav li button{display:block;width:100%;text-align:left;background:none;border:0;font:inherit;color:var(--ink);padding:7px 0 7px 0;cursor:pointer;transition:transform .2s,color .2s}
nav li button:hover{transform:translateX(6px);color:var(--accent)}
nav li button[aria-current="true"]{color:var(--accent);font-weight:700}
nav li button[aria-current="true"]::before{content:"▸ "}
.work{display:grid;grid-template-rows:1fr minmax(240px,38%);min-height:0}
.editor{display:grid;grid-template-columns:48px 1fr;min-height:0;background:var(--code-bg);border-bottom:1px solid var(--line)}
.gutter{font-family:"JetBrains Mono",monospace;font-size:15px;line-height:1.75;color:var(--cm);text-align:right;padding:20px 10px 20px 0;user-select:none;white-space:pre;border-right:1px solid var(--line);overflow:hidden}
.code{font-family:"JetBrains Mono",monospace;font-size:16px;line-height:1.75;padding:20px 24px;margin:0;overflow:auto;white-space:pre;tab-size:4;outline:none}
.code:focus-visible{box-shadow:inset 3px 0 0 var(--accent)}
.k{color:var(--kw)}.s{color:var(--str)}.c{color:var(--cm)}.n{color:var(--num)}
.runbar{display:flex;align-items:center;gap:22px;padding:10px 24px;border-top:1px solid var(--line);background:var(--bg)}
.run{background:var(--ink);color:var(--bg);border:0;font:inherit;font-weight:700;padding:9px 26px;cursor:pointer;transition:transform .15s,background .2s}
.run:hover{background:var(--accent);color:var(--accent-ink);transform:translateY(-2px)}
.run:active{transform:translateY(1px)}
.hint{color:var(--sub);font-size:16px}
.editorwrap{display:grid;grid-template-rows:1fr auto;min-height:0}
.lower{display:grid;grid-template-columns:1fr 1fr;min-height:0}
.panel{padding:16px 24px;overflow:auto;min-height:0}
.panel + .panel{border-left:1px solid var(--line)}
.panel h3{font-size:15px;margin:0 0 8px;color:var(--sub);font-weight:600;letter-spacing:.04em}
#log{font-family:"JetBrains Mono",monospace;font-size:15px;line-height:1.7;white-space:pre-wrap;margin:0}
#log .t{color:var(--accent)}
canvas{width:auto;max-width:100%;height:calc(100% - 34px);aspect-ratio:5/3;display:block;background:var(--paper);border:1px solid var(--line)}
.legend{font-size:15px;color:var(--sub)}
@media (max-width:820px){
  .app{height:auto}
  header{flex-wrap:wrap;gap:10px 18px;padding:12px 16px}
  h1 small{display:block;margin:0}
  main{grid-template-columns:1fr}
  nav{border-right:0;border-bottom:1px solid var(--line);padding:14px 16px}
  nav ol{display:flex;gap:6px 16px;flex-wrap:wrap;margin-bottom:10px}
  .work{grid-template-rows:auto auto}
  .editor{min-height:300px}
  .lower{grid-template-columns:1fr}
  .panel + .panel{border-left:0;border-top:1px solid var(--line)}
  canvas{height:260px}
  .runbar{flex-wrap:wrap;padding:10px 16px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>알티노 코딩 실험실<small>3인 1조 · AI가 쓴 코드를 붙여 넣고 달려 보세요</small></h1>
    <div class="spacer"></div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">연결 안 됨</span></div>
    <button class="link" id="connectBtn">알티노 연결하기</button>
    <button class="link" id="fakeBtn">가짜 알티노로 연습</button>
    <button class="link stop" id="stopBtn">긴급 정지</button>
  </header>
  <main>
    <nav aria-label="샘플 코드">
      <h2>샘플 불러오기</h2>
      <ol id="samples"></ol>
      <h2>도움말</h2>
      <ol>
        <li><button>명령어 한눈에 보기</button></li>
        <li><button>AI에게 물어볼 말 모음</button></li>
        <li><button>연결이 안 될 때</button></li>
      </ol>
    </nav>
    <div class="work">
      <div class="editorwrap">
        <div class="editor">
          <div class="gutter" id="gutter"></div>
          <pre class="code" id="code" contenteditable="true" spellcheck="false" aria-label="파이썬 코드 입력"></pre>
        </div>
        <div class="runbar">
          <button class="run" id="runBtn">▶ 실행</button>
          <span class="hint">코드는 AI에게 받은 걸 그대로 붙여 넣어도 돼요. 소리는 Sound(0)으로 꼭 끄기!</span>
        </div>
      </div>
      <div class="lower">
        <div class="panel"><h3>결과 창</h3><pre id="log"></pre></div>
        <div class="panel"><h3>알티노 움직임 <span class="legend">· 눈금 한 칸 = 50cm (대략)</span></h3><canvas id="cv" width="600" height="360"></canvas></div>
      </div>
    </div>
  </main>
</div>
<script>
const SAMPLES = {
  "연결 테스트": `from AltinoLite import *

Open('COM4')
Sound(1)        # 소리 켜기
delay(1000)     # 1초 기다리기
Sound(0)        # 소리 끄기
Close()`,
  "앞으로 갔다 멈추기": `from AltinoLite import *

Open('COM4')
Go(300, 300)    # 앞으로
delay(2000)
Stop()
Close()`,
  "네모 그리며 달리기": `from AltinoLite import *

Open('COM4')
for i in range(4):
    Steering(0)
    Go(300, 300)
    delay(2000)     # 한 변
    Steering(127)   # 핸들 오른쪽 끝
    delay(1500)     # 모서리 도는 시간
Stop()
Close()`,
  "지그재그 퍼레이드": `from AltinoLite import *

Open('COM4')
Light(1)
for i in range(3):
    Steering(-100); Go(300, 300); delay(800)
    Steering(100);  delay(800)
Stop()
Close()`
};
const samplesEl=document.getElementById('samples'),code=document.getElementById('code'),gutter=document.getElementById('gutter'),log=document.getElementById('log');
function hl(src){
  return src.replace(/&/g,'&amp;').replace(/</g,'&lt;').split('\n').map(l=>{
    let c='';const i=l.indexOf('#');if(i>=0){c='<span class="c">'+l.slice(i)+'</span>';l=l.slice(0,i)}
    l=l.replace(/('[^']*')/g,'<span class="s">$1</span>').replace(/\b(from|import|for|in|range|while|if|else|def|try|finally|break)\b/g,'<span class="k">$1</span>').replace(/(?<![\w">])(\d+)(?![\w"])/g,'<span class="n">$1</span>');
    return l+c}).join('\n');
}
function setCode(t){code.innerHTML=hl(t);lines()}
function lines(){const n=code.textContent.split('\n').length;gutter.textContent=Array.from({length:n},(_,i)=>i+1).join('\n')}
code.addEventListener('input',lines);
Object.keys(SAMPLES).forEach((k,i)=>{const li=document.createElement('li');const b=document.createElement('button');b.textContent=k;
  b.onclick=()=>{[...samplesEl.querySelectorAll('button')].forEach(x=>x.removeAttribute('aria-current'));b.setAttribute('aria-current','true');setCode(SAMPLES[k]);say('샘플을 불러왔어요: '+k)};
  li.appendChild(b);samplesEl.appendChild(li);if(i===2)b.click()});
function say(m){log.innerHTML+=m+'\n';log.parentElement.scrollTop=1e9}
let connected=false;
function setConn(on,txt){connected=on;document.getElementById('status').classList.toggle('on',on);document.getElementById('statusText').textContent=txt}
document.getElementById('connectBtn').onclick=()=>say('<span class="t">[연결]</span> 블루투스 목록 창이 열려요 (시안에서는 동작하지 않아요)');
document.getElementById('fakeBtn').onclick=()=>{setConn(true,'가짜 알티노 연결됨');say('<span class="t">[연결]</span> 가짜 알티노와 연결했어요')};
// 간단한 움직임 그림 (시안용)
const cv=document.getElementById('cv'),g=cv.getContext('2d');let timer=null;
function grid(){const s=getComputedStyle(document.documentElement);g.clearRect(0,0,600,360);g.strokeStyle=s.getPropertyValue('--line');g.lineWidth=1;
  for(let x=0;x<=600;x+=60){g.beginPath();g.moveTo(x,0);g.lineTo(x,360);g.stroke()}for(let y=0;y<=360;y+=60){g.beginPath();g.moveTo(0,y);g.lineTo(600,y);g.stroke()}}
grid();
function run(){
  if(!connected){say('<span class="t">[안내]</span> 먼저 위에서 알티노를 연결하거나 가짜 알티노를 눌러 주세요');return}
  clearInterval(timer);grid();const s=getComputedStyle(document.documentElement);
  let x=200,y=300,h=-90,t=0;g.strokeStyle=s.getPropertyValue('--accent');g.lineWidth=3;g.beginPath();g.moveTo(x,y);
  say('<span class="t">[실행]</span> Open → 달리는 중…');
  timer=setInterval(()=>{t++;const turning=(t%70)>45;h+=turning?2.6:0;x+=Math.cos(h*Math.PI/180)*2.2;y+=Math.sin(h*Math.PI/180)*2.2;g.lineTo(x,y);g.stroke();
    if(t>=280){clearInterval(timer);say('<span class="t">[끝]</span> Stop → Close. 모서리 시간(1500)을 바꿔 보세요!')}},25);
}
document.getElementById('runBtn').onclick=run;
document.getElementById('stopBtn').onclick=()=>{clearInterval(timer);say('<span class="t">[정지]</span> 모든 동작을 멈췄어요')};
</script>
</body>
</html>
